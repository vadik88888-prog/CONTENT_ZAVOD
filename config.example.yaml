# Скопируйте файл как config.yaml и меняйте только нужные параметры.
whisper_model: small
language: null                 # null = определить автоматически
device: auto                   # auto, cuda или cpu
compute_type: auto             # auto, float16, int8_float16 или int8
min_clip_duration: 15
target_clip_duration: 35
max_clip_duration: 60
max_clips: 5
score_threshold: 60
overlap_threshold: 0.55
pre_roll_seconds: 0.35
post_roll_seconds: 0.35
render_mode: blur-background   # blur-background или center-crop
subtitles_enabled: true
output_width: 1080
output_height: 1920
encoder_preference: auto       # auto, nvenc или cpu
delete_downloaded_source: false
ai:
  provider: openai             # openai, gemini или mock
  model: gpt-5-mini            # модель задаётся только здесь
  max_retries: 2
  # USD за токен; обновляйте по тарифу выбранной модели при необходимости.
  input_token_price: 0.00000025
  output_token_price: 0.000002
mock_ai: false                 # совместимость; для разового запуска используйте --mock-ai
transcript_features:
  hook_patterns: ["почему", "как", "никогда", "главная ошибка", "вот что произошло", "самое важное", "how", "why"]
  filler_words: ["ээ", "эм", "ну", "как бы", "типа", "короче", "uh", "um", "like"]
audio_analysis:
  window_seconds: 0.1
  silence_threshold: 0.08
  min_silence_seconds: 0.3
scene_detection:
  enabled: true
  threshold: 0.35
candidate_generation:
  min_duration_seconds: 15
  target_duration_seconds: 30
  max_duration_seconds: 60
  boundary_search_radius_seconds: 4
  max_candidates: 100
  overlap_limit: 0.75
content_understanding:
  # Goal 5A: source-scoped semantic analysis. These settings never depend on
  # subtitle style, export bitrate or render-only revisions.
  enabled: true
  strategy_version: 5A.1
  profile_schema_version: 5A.1
  content_map_schema_version: 5A.1
  story_unit_schema_version: 5A.1
  boundary_schema_version: 5A.1
  coverage_schema_version: 5A.1
  coverage_selection_version: 5A.1
  chapter_pause_seconds: 1.25
  max_chapter_seconds: 110
  min_story_unit_seconds: 12
  target_story_unit_seconds: 38
  max_story_unit_seconds: 90
  max_head_padding_seconds: 0.5
  target_head_padding_seconds: 0.25
  min_tail_padding_seconds: 0.25
  target_tail_padding_seconds: 0.65
  max_tail_padding_seconds: 1.5
  max_semantic_extension_seconds: 12
  continuation_risk_threshold: 0.65
  strong_story_unit_threshold: 0.55
  semantic_duplicate_threshold: 0.78
  # Coverage может выбрать самостоятельную StoryUnit ниже legacy score_threshold,
  # но не ниже этого пола и только после semantic/boundary validation.
  coverage_min_quality_score: 55
  coverage_weights:
    base_quality: 0.36
    standalone: 0.12
    completeness: 0.10
    boundary: 0.11
    incremental_coverage: 0.12
    chapter_diversity: 0.05
    topic_diversity: 0.06
    emotional_diversity: 0.02
    temporal_diversity: 0.02
    semantic_duplicate_penalty: 0.25
    context_dependency_penalty: 0.10
    repetition_penalty: 0.08
virality:
  # Goal 5B: comparative content-strength signals, not a prediction of views.
  enabled: true
  schema_version: 5B.1
  scoring_config_version: 5B.1
  strategy_version: 5B.1
  # "auto" uses bounded grounded semantic assistance when available and falls
  # back to the deterministic local profile if it is not.
  semantic_ai_mode: auto
  max_ai_batch_candidates: 20
  minimum_quality_score: 0.52
  minimum_publishability_score: 0.55
  strong_story_unit_threshold: 0.55
  uncertainty_tiebreak_weight: 0.08
  dead_zone_minimum_seconds: 1.4
  dead_zone_penalty_weight: 0.10
  weights:
    hook: 0.13
    curiosity: 0.07
    emotion: 0.09
    conflict: 0.07
    specificity: 0.08
    novelty: 0.06
    usefulness: 0.08
    quotability: 0.08
    momentum: 0.09
    payoff: 0.12
    retention: 0.08
    publishability: 0.05
scoring:
  weights:
    hook: 0.18
    completeness: 0.18
    clarity: 0.12
    speech_density: 0.08
    pacing: 0.08
    audio_energy: 0.08
    scene_structure: 0.10
    context_independence: 0.10
    boundary_quality: 0.08
  repetition_penalty_weight: 12
  filler_penalty_weight: 18
ai_reranking:
  enabled: true
  shortlist_size: 15
  final_clip_count: 3
transformation:
  # false сохраняет прежнее поведение; включите --transform-script для разового запуска.
  enabled: false
  mode: auto
  ai_strategy: compact          # compact, staged или local_only
  target_duration_seconds: 35
  min_duration_seconds: 20
  max_duration_seconds: 60
  target_words_per_second: 2.4
  preserve_language: true
  output_language: auto         # ru/en требует отдельной future translation stage
  allow_translation: false
  context_before_seconds: 10
  context_after_seconds: 10
  allow_cta: false
  max_repair_attempts: 1
  fallback_enabled: true
  strict_grounding: true
  minimum_grounding_score: 0.90
  minimum_quality_score: 0.55
  semantic_validation_enabled: true
  cache_enabled: true
  # Только для тестов: valid, invalid_fact_id, unsupported_number, changed_negation,
  # malformed_json, provider_error, empty_script, repair_success, repair_failure.
  mock_mode: valid
  weights:
    hook_strength: 0.10
    clarity: 0.10
    completeness: 0.10
    brevity: 0.08
    information_density: 0.08
    context_independence: 0.09
    naturalness: 0.08
    pacing: 0.07
    ending_strength: 0.07
    factual_grounding: 0.14
    source_coverage: 0.09
production:
  # Строится локально после FinalScript; никаких TTS, аудио или FFmpeg-операций.
  enabled: true
  cache_enabled: true
  narration_words_per_second: 2.4
  pause_after_narration_seconds: 0.25
  voice_profile_id: default-documentary
  voice_gender: neutral           # male, female или neutral — только placeholder
  voice_style: documentary        # calm, energetic, documentary или conversational
  original_dialogue_speaker: original_speaker_unknown
tts:
  # Goal 3B synthesizes only existing narration segments from ProductionPlan.
  # It never changes FinalScript/ProductionPlan and never mixes or renders audio/video.
  enabled: false
  provider: openai                # openai, mock or local (typed no-audio fallback)
  model: gpt-4o-mini-tts
  voice: auto                     # auto uses the deterministic VoiceProfile registry; or a provider voice such as cedar
  language: auto                  # auto = ProductionPlan language; ru or en can override
  speed: 1.0
  budget_limit: 1.0               # USD estimate guard before any provider request
  cost_per_1m_characters: 15.0    # USD estimate; update for the selected provider/model tariff
  timeout_seconds: 45
  max_retries: 2
  cache_enabled: true
  output_format: wav              # normalized downstream format is WAV PCM s16le, mono
  sample_rate: 48000
  # ProductionPlan timing is approximate: a difference creates a warning first.
  duration_warning_ratio: 0.50
  duration_error_ratio: 6.0
  minimum_audio_duration: 0.10
  maximum_segment_duration: 120
  provider_config_version: 3B.0
  # Test-only mock modes: valid, provider_error, timeout, empty_audio, malformed_response.
  mock_mode: valid
audio_composition:
  # Goal 3C reads existing ProductionPlan + TTS artifacts and creates audio only.
  # It never starts a new video/ASS/subtitle render and never changes the plan.
  enabled: false
  cache_enabled: true
  sample_rate: 48000
  output_format: wav
  ducking_enabled: true
  duck_level: 0.35             # Original source remains audible under narration.
  duck_attack_seconds: 0.08
  duck_release_seconds: 0.20
  preserve_original_events: true
  narration_target_lufs: -16.0
  narration_true_peak_db: -1.5
  narration_lra: 11.0
  engine_version: 3C.0
production_render:
  # Goal 3D is isolated from legacy render and disabled until explicitly requested.
  enabled: false
  cache_enabled: true
  output_width: 1080
  output_height: 1920
  output_fps: 30
  video_codec: h264
  video_bitrate: 6M
  pixel_format: yuv420p
  encoder: auto                 # auto, nvenc or cpu; auto safely falls back to CPU
  crop_strategy: fit_blur_background
  manual_crop_x: 0.5
  manual_crop_y: 0.5
  transitions: cut
  subtitles_enabled: true
  subtitle_style: documentary   # minimal, documentary, dynamic or clean
  subtitle_font_family: Arial
  subtitle_max_chars_per_line: 28
  subtitle_max_lines: 2
  subtitle_min_duration: 0.45
  subtitle_max_duration: 3.5
  subtitle_reading_speed_cps: 15.0
  maximum_freeze_duration: 1.5
  maximum_loop_duration: 0.0
  minimum_clip_duration: 0.10
  maximum_speed_adjustment: 1.0
  av_sync_warning_ms: 100
  av_sync_error_ms: 350
  maximum_duration_difference: 0.35
  render_config_version: 3D.0
min_selected_clip_distance_seconds: 8
optional_visual_features: false
